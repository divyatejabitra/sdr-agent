research_task:
  description: >
    Research {prospect_name} ({prospect_title}) at {prospect_company}
    for a {campaign_type} outreach email from {sender_name} at {sender_company}.

    Company website if provided: {company_website}
    Extra notes from the sender: {extra_notes}

    Tool availability for this run: {tools_status_note}

    How to work:
    1. If tools are available, look up the company and any recent public
       news, hiring, funding, product, or ops signals, and scrape the
       website if one is provided. Cite only URLs you actually retrieved.
    2. If tools are NOT available, skip straight to step 4 - work only from
       the lead file and extra_notes above. Never say you "searched",
       "found no results", or "couldn't find" anything online when no
       search tool ran; that misrepresents a lookup that never happened.
    3. If a tool DID run but returned nothing relevant or verifiable (e.g.
       no results, an unrelated company, a dead domain), do not assert any
       specific factual claim about the company from that empty result -
       not even something that sounds minor, like domain or business
       status. Instead record it plainly in unknowns, e.g. "search for
       {prospect_company} returned no verifiable public results."
    4. Infer 2-4 likely priorities for someone in this role — mark inferences
       as inferences, not facts.
    5. Produce personalization hooks that are safe if a fact cannot be verified.
    6. Do not invent awards, quotes, headcount, revenue, personal life
       details, or the technical/operational status of anything (a
       website, a product, a filing) that you did not actually verify from
       a retrieved source this run.
    7. Do not list the prospect's company_website as a "source" unless a
       scrape tool actually fetched it this run.
    8. Every specific, checkable claim in company_summary or recent_signals
       must trace to an entry in sources. If it doesn't, it isn't a
       verified claim - move it to unknowns or drop it, don't state it.

    Focus on information that would make a first email feel relevant.
  expected_output: >
    A structured research brief with: used_live_tools (true only if a
    search/scrape tool call actually ran), company_summary (3-5 sentences,
    containing only claims traceable to sources - general role/industry
    inference belongs in likely_priorities, not stated as fact here),
    likely_priorities (2-4 items), personalization_hooks (3 items),
    recent_signals (0-5 items, empty if no tools ran or nothing verifiable
    turned up), sources (URLs actually retrieved this run, empty list if no
    tools ran or nothing relevant was found), and unknowns (what you could
    not verify, including any search that ran but returned nothing useful).
  agent: prospect_researcher

write_email_task:
  description: >
    Write one {campaign_type} email from {sender_name} ({sender_title})
    at {sender_company} to {prospect_name} ({prospect_title}) at
    {prospect_company}. Prospect email: {prospect_email}.

    Product: {product_name}
    Value proposition: {value_proposition}
    Offer details (use for offer campaigns): {offer_details}
    Update details (use for update campaigns): {update_details}
    Sender email: {sender_email}
    Physical mailing address: {physical_address}

    Campaign rules:
    - cold: first-touch. Personalize from research. Soft CTA (15-min chat
      or yes/no question). Do not attach a hard sell.
    - offer: lead with the specific offer, who it is for, what they get,
      deadline if real, and a single CTA. Do not invent a deadline.
    - update: share a useful product/company update tied to their world.
      Assume some prior awareness unless research says otherwise. CTA can
      be a reply, resource, or booking link if provided in the notes.

    Style:
    - Subject: specific, human, under 8 words, not clickbait, no ALL CAPS
    - Body: 80-140 words, 2-4 short paragraphs, one CTA
    - Sign-off with sender name, title, company, email
    - Last line: "If this isn't relevant, reply STOP and I won't email again."
    - Include the physical mailing address in the signature
    - Do not mention tools, the research brief, or that you are an AI
    - Do not claim you "noticed" something unless it is in the research
      with a source, or it was provided in extra_notes
  expected_output: >
    A structured email with fields: subject, preview_text, body (plain text,
    including greeting, signature, address, and opt-out line),
    personalization_hooks_used, call_to_action, and compliance_notes.
  agent: sdr_copywriter
